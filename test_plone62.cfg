[buildout]

extends =
    https://raw.githubusercontent.com/collective/buildout.plonetest/master/test-6.2.x.cfg
    https://raw.githubusercontent.com/collective/buildout.plonetest/master/qa.cfg
    https://raw.githubusercontent.com/IMIO/buildout.smartweb/plone62/sources.cfg
    base.cfg

update-versions-file = test_plone62.cfg

sources-dir = devel
# The released versions of these packages still use pkg_resources, and
# imio.omnia.core 1.3 does not declare its imio.helpers dependency
auto-checkout =
    imio.omnia.core
    imio.helpers

[versions]
createcoverage = 1.5
watchdog = 2.1.6
# First releases for Plone 6.2 (PEP 420, no pkg_resources)
collective.behavior.talcondition = 2.0.0
collective.fingerpointing = 2.0.0

# Added by buildout at 2026-11-17 08:47:27.420938
Authlib = 1.7.2
file-read-backwards = 3.2.0
i18ndude = 6.3.0
imio.pyutils = 1.2.3
joserfc = 1.8.0
shortuuid = 1.0.13
truststore = 0.10.5

# Required by:
# imio.omnia.core==1.4.dev0
collective.z3cform.datagridfield = 4.0.3

# Required by:
# imio.omnia.core==1.4.dev0
httpx2 = 2.16.2

# Required by:
# imio.omnia.core==1.4.dev0
# imio.omnia.tinymce==1.1.dev0
z3c.jbot = 3.1
